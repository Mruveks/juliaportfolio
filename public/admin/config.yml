backend:
  name: git-gateway
  branch: claude/portfolio-website-nextjs-r6tOg

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "portfolio"
    label: "Portfolio"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Image"
        name: "image"
        widget: "image"
        required: false
      - label: "Video URL"
        name: "videoUrl"
        widget: "string"
        required: false
        hint: "YouTube or Vimeo URL"
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Brand Campaign"
          - "Instagram Growth"
          - "TikTok Content"
          - "Analytics"
          - "Strategy"
          - "Content Creation"
      - label: "Order"
        name: "order"
        widget: "number"
        default: 0

  - name: "reels"
    label: "Reels"
    folder: "content/reels"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Description"
        name: "description"
        widget: "text"
        required: false
      - label: "Video URL"
        name: "videoUrl"
        widget: "string"
        hint: "YouTube, Vimeo, or direct video URL"
      - label: "Thumbnail"
        name: "thumbnail"
        widget: "image"
        required: false
      - label: "Order"
        name: "order"
        widget: "number"
        default: 0
